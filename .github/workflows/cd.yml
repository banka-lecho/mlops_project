name: CD

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  functional-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Docker image
        run: |
          docker pull shpilevaanastasiya/vlm-api:latest

      - name: Download model
        run: |
          pip install huggingface_hub
          hf download openai/clip-vit-base-patch32 \
            --local-dir ./models/clip-vit-base-patch32

      - name: Start container
        run: |
          docker run -d \
            --name vlm-api \
            -p 8000:8000 \
            -v "${{ github.workspace }}/models:/app/models:ro" \
            shpilevaanastasiya/vlm-api:latest

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done

          echo "API did not start"
          docker logs vlm-api
          exit 1

      - name: Install test dependencies
        run: |
          pip install requests pytest

      - name: Run functional tests
        run: |
          pytest src/unit_tests/tests_functionality -v

      - name: Show container logs
        if: always()
        run: |
          docker logs vlm-api

      - name: Stop container
        if: always()
        run: |
          docker stop vlm-api || true
          docker rm vlm-api || true