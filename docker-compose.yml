services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: emotion-prediction-api

    ports:
      - "8000:8000"

    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./logs:/app/logs

    environment:
      CONFIG_PATH: /app/config.ini
      MODEL_PATH: /app/models/clip-vit-base-patch32

    restart: unless-stopped